name: Inspect Windows acceptance failure
on:
  push:
    paths: [".github/workflows/inspect.yml"]
  workflow_dispatch:
    inputs:
      run:
        description: Windows workflow run ID from this repository and branch
        required: true
permissions: {actions: read, contents: read}
jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize the failing assertion in GitHub check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run || '44260262509' }}
        run: |
          [[ "$RUN" =~ ^[0-9]+$ ]]
          gh api repos/$GITHUB_REPOSITORY/actions/runs/$RUN | jq -e --arg ref "$GITHUB_REF_NAME" '.head_branch==$ref and (.path==".github/workflows/windows.yml" or .path==".github/workflows/candidate.yml")'
          gh run view "$RUN" -R "$GITHUB_REPOSITORY" --log-failed > "$RUN.log"
          tail -8 "$RUN.log" | sed -E 's/\x1B\[[0-9;]*[mK]//g; s/.*Z //' | cut -c1-450 | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
