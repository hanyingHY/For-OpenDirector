name: Diagnose installed Windows UX (title bar close)
on:
  push:
    paths: ['.github/workflows/rehearse.yml']
permissions: {contents: read, actions: read}
jobs:
  installed:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: Windows-installer-x64
          run-id: 44260262509
          github-token: ${{ github.token }}
          path: delivery
      - run: ./scripts/smoke.ps1
        env: {OD_VERIFY_RENDER: '1', OD_AGENT_DIAGNOSTIC: '1'}
      - name: Report synthetic test-only Agent errors
        if: failure()
        shell: pwsh
        run: |
          $path=Join-Path ([IO.Path]::GetTempPath()) 'OpenDirector 测试 projects'
          Get-ChildItem $path -Recurse -Filter '*.opencode.jsonl' | Select-Object -Last 1 | ForEach-Object {
            Get-Content $_.FullName | Select-String -Pattern 'error|stderr|failed' | Select-Object -Last 3 | ForEach-Object { Write-Output ('::warning::'+($_.Line.Substring(0,[Math]::Min($_.Line.Length,900)))) }
          }
          Get-Content "$env:TEMP/od-task-locations.txt" -ErrorAction SilentlyContinue | Where-Object { $_ -match 'skill|turn|produce|model|native|httpx|stream_chat' } | Select-Object -First 4 | ForEach-Object { Write-Output "::notice::$_" }
          Get-ChildItem $path -Recurse -Filter '*.jsonl' | ForEach-Object { Write-Output "::notice::Trace $($_.Name), $($_.Length) bytes" }
          $logs=Get-ChildItem "$env:USERPROFILE/.local/share/opencode/log" -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending
          if ($logs) { Get-Content $logs[0].FullName -Tail 6 | ForEach-Object { Write-Output ('::notice::OpenCode '+$_.Substring(0,[Math]::Min(500,$_.Length))) } }
