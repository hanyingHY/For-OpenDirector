name: Windows x64 desktop
on:
  workflow_dispatch:
  push:
    paths: ["desktop/**", "patches/**", "scripts/**", "verification/**", "tests/**", ".github/workflows/windows.yml"]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Assemble original UI, services and Windows runtime
        run: python scripts/package.py
      - name: Native Agent skill and project write (deterministic model)
        timeout-minutes: 5
        run: ./scripts/agent-check.ps1
      - name: Compile installer
        id: package
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 desktop\setup.nsi; exit $LASTEXITCODE'
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installer-x64
          path: delivery/*.exe
          compression-level: 0
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/arena/78ad8084-for-opendirector'
        with:
          run-id: 44297067032
          github-token: ${{ github.token }}
          name: Windows-installer-x64
          path: .work/previous
      - name: Verify desktop.6 baseline bytes
        if: github.ref == 'refs/heads/arena/78ad8084-for-opendirector'
        shell: pwsh
        run: |
          $previous = Get-Item .work/previous/OpenDirector-0.1.4-desktop.6-x64-Setup.exe
          if ((Get-FileHash $previous).Hash -ne '922a78662aa981c114137be99a73e43fd636fd4b57197115e0bfd2ab1e195d2d') { throw 'Unexpected desktop.6 hash' }
          "OD_PREVIOUS_INSTALLER=$($previous.FullName)" >> $env:GITHUB_ENV
      - name: Exercise installed application
        timeout-minutes: 10
        env:
          OD_VERIFY_RENDER: '1'
        run: ./scripts/smoke.ps1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Windows-native-evidence
          path: |
            delivery/windows-*.png
            delivery/windows-demo.mp4
            delivery/windows-sidebar.mp4
            delivery/windows-workflow.mp4
            delivery/timeline-export.mp4
  sign-update:
    needs: package
    if: github.repository == 'hanyingHY/For-OpenDirector' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/78ad8084-for-opendirector')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with: {name: Windows-installer-x64, path: delivery}
      - run: python3 scripts/update-manifest.py delivery
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: delivery/windows-update.json
          release-signing-artifacts: false
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-update-metadata
          path: delivery/windows-update.json*
  update-handoff:
    needs: sign-update
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: Windows-installer-x64, path: delivery}
      - uses: actions/download-artifact@v4
        with: {name: Windows-update-metadata, path: delivery}
      - name: Exercise verified handoff and restart
        shell: pwsh
        run: |
          python -m pip install sigstore==4.5.1
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python verification/update_handoff.py
          exit $LASTEXITCODE
